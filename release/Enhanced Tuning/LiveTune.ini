; Enhanced Tuning settings. Restart the game after changing.
; Your tunes are saved separately, per car, in tunes.ini in this folder.

[Tab]
; Where the Enhanced Tuning tab sits in the Tuning menu: first (left of Tires) or last (after Differential).
Position=first

[Display]
; 1 = car stat screens (car select, dealers, upgrades) show power and torque multiplied by the
;     Horsepower slider. Display only: the car's class, PI and saved garage row are not changed.
; 0 = stat screens show the stock figures.
ScalePower=1
